<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khăn mặt - Khăn & Áo choàng tắm Nõn Sợi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/common.css" rel="stylesheet" />
  <link href="css/products.css" rel="stylesheet" />
</head>

<body>
  <div id="header-placeholder"></div>
  <section class="container py-4" id="product-detail" data-category="face">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
        <li class="breadcrumb-item"><a href="face-towels.html">Khăn mặt</a></li>
        <li class="breadcrumb-item active" aria-current="page" id="detail-breadcrumb"></li>
      </ol>
    </nav>

    <div class="row g-4">
      <!-- Gallery -->
      <div class="col-lg-6">
        <div class="product-gallery">
          <div class="main-image-container">
            <img id="main-image" class="main-product-image" alt="Ảnh sản phẩm" />
            <button class="gallery-nav gallery-nav-prev" type="button" id="gallery-prev" aria-label="Ảnh trước">
              <i class="bi bi-chevron-left"></i>
            </button>
            <button class="gallery-nav gallery-nav-next" type="button" id="gallery-next" aria-label="Ảnh sau">
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>
          <div class="thumbnail-container">
            <div class="thumbnail-wrapper" id="thumbnail-wrapper"></div>
          </div>
        </div>
      </div>

      <!-- Info -->
      <div class="col-lg-6">
        <div class="product-info">
          <p class="text-muted mb-1" id="detail-category"></p>
          <h2 class="mb-3" id="detail-name"></h2>
          <div class="mb-3 text-warning" id="detail-rating" hidden></div>
          <div class="d-flex align-items-center mb-3">
            <span class="price fs-4 me-3" id="detail-price"></span>
            <span class="old-price fs-5" id="detail-old-price"></span>
          </div>
          <p class="product-description mb-4" id="detail-desc"></p>

          <h6 class="fw-bold">Kích thước</h6>
          <div class="d-flex flex-wrap gap-2 mb-4" id="size-wrapper"></div>

          <div class="d-flex flex-wrap gap-2 mb-4">
            <button class="btn btn-outline-dark btn-lg" id="detail-add-cart">
              <i class="bi bi-cart-plus me-2"></i>Thêm vào giỏ
            </button>
            <button class="btn btn-outline-danger btn-lg wishlist-btn" id="detail-add-wishlist"
              title="Thêm vào danh sách yêu thích">
              <i class="bi bi-heart me-1"></i>Yêu thích
            </button>
          </div>

          <p class="text-success small mb-3" id="detail-selected-size"></p>

          <table class="table table-borderless align-middle mb-0">
            <tbody>
              <tr>
                <th class="text-muted fw-normal">Thành phần vải</th>
                <td id="detail-material">-</td>
              </tr>
              <tr>
                <th class="text-muted fw-normal">Kích thước</th>
                <td id="detail-size-info">-</td>
              </tr>
              <tr>
                <th class="text-muted fw-normal">Nguồn nguyên liệu</th>
                <td id="detail-material-source">-</td>
              </tr>
              <tr>
                <th class="text-muted fw-normal">Đơn vị phát triển</th>
                <td id="detail-developer">-</td>
              </tr>
              <tr>
                <th class="text-muted fw-normal">Đơn vị sản xuất</th>
                <td id="detail-manufacturer">-</td>
              </tr>
              <tr>
                <th class="text-muted fw-normal">Năm phát triển mẫu</th>
                <td id="detail-development-year">-</td>
              </tr>
              <tr>
                <th class="text-muted fw-normal">Bảo quản</th>
                <td id="detail-care">-</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </section>
  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/search.js"></script>
  <script src="js/product-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/detail-page.js"></script>

  <script>
    // Load header and footer components
    $(document).ready(function () {
      $('#header-placeholder').load('components/header.html', function () {
        if (typeof window.initializeHeaderComponents === 'function') {
          window.initializeHeaderComponents();
        }
        if (typeof setActiveNavItem === 'function') {
          setActiveNavItem();
        }
      });
      $('#footer-placeholder').load('components/footer.html');
    });
  </script>
</body>

</html>
