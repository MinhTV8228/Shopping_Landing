<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Khăn &amp; Áo choàng tắm Nõn Sợi</title>

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Custom CSS -->
  <link href="css/common.css" rel="stylesheet" />
  <link href="css/auth.css" rel="stylesheet" />
</head>

<body class="auth-page">
  <!-- Include Header Component -->
  <div id="header-placeholder"></div>

  <!-- Đăng nhập Section -->
  <section class="auth-section py-5">
    <div class="auth-flex-container">
      <!-- Left Image -->
      <div class="auth-image-left d-none d-xl-block">
        <img src="images/bath_robe/bathrobe_1.jpg" alt="Áo choàng tắm Nõn Sợi" class="img-fluid">
      </div>

      <div class="auth-main-content">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-12">
              <div class="auth-card">
                <div class="auth-header">
                  <h2>Đăng nhập</h2>
                  <p>Chào mừng bạn quay trở lại! Vui lòng đăng nhập vào tài khoản.</p>
                </div>

                <!-- Đăng nhập Form -->
                <form id="loginForm" class="auth-form" novalidate>
                  <!-- Email Field -->
                  <div class="form-group">
                    <label for="loginEmail" class="form-label">Email</label>
                    <div class="input-group">
                      <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                      </span>
                      <input type="email" class="form-control" id="loginEmail" name="email"
                        placeholder="Nhập email của bạn" required />
                    </div>
                    <div class="invalid-feedback"></div>
                  </div>

                  <!-- Mật khẩu Field -->
                  <div class="form-group">
                    <label for="loginPassword" class="form-label">Mật khẩu</label>
                    <div class="input-group">
                      <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                      </span>
                      <input type="password" class="form-control" id="loginPassword" name="password"
                        placeholder="Nhập mật khẩu của bạn" required />
                      <button type="button" class="btn btn-outline-secondary password-toggle"
                        data-target="loginPassword">
                        <i class="bi bi-eye"></i>
                      </button>
                    </div>
                    <div class="invalid-feedback"></div>
                  </div>

                  <!-- Remember Me & Forgot Mật khẩu -->
                  <div class="form-group d-flex justify-content-between align-items-center">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="rememberMe" name="remember" />
                      <label class="form-check-label" for="rememberMe">
                        Ghi nhớ đăng nhập
                      </label>
                    </div>
                    <a href="#" class="forgot-password">Quên mật khẩu?</a>
                  </div>

                  <!-- Gửi Button -->
                  <button type="submit" class="btn btn-primary auth-submit">
                    <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                    Đăng nhập
                  </button>

                  <!-- Social Đăng nhập -->
                  <div class="social-divider">
                    <span>Hoặc đăng nhập bằng</span>
                  </div>

                  <div class="social-login">
                    <button type="button" class="btn btn-outline-danger social-btn">
                      <i class="bi bi-google"></i>
                      Google
                    </button>
                    <button type="button" class="btn btn-outline-primary social-btn">
                      <i class="bi bi-facebook"></i>
                      Facebook
                    </button>
                  </div>

                  <!-- Đăng ký Link -->
                  <div class="auth-footer">
                    <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Image -->
      <div class="auth-image-right d-none d-xl-block">
        <img src="images/face_towel/facetowel_2.jpg" alt="Khăn mặt Nõn Sợi" class="img-fluid">
      </div>
    </div>
  </section>

  <!-- Include Footer Component -->
  <div id="footer-placeholder" class="mt-5 pt-5"></div>

  <!-- Alert Modal -->
  <div class="modal fade" id="alertModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="alertModalTitle">Thông báo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="alertModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Đồng ý</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/product-data.js"></script>
  <script src="js/search.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Load header and footer components
    $(document).ready(function () {
      $('#header-placeholder').load('components/header.html', function () {
        // After header is loaded, initialize components
        if (typeof window.initializeHeaderComponents === 'function') {
          window.initializeHeaderComponents();
        }
        // Also set active navigation
        if (typeof setActiveNavItem === 'function') {
          setActiveNavItem();
        }
      });
      $('#footer-placeholder').load('components/footer.html');
    });
  </script>
</body>

</html>
