<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khuyến mãi - Khăn & Áo choàng tắm Nõn Sợi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/common.css" rel="stylesheet" />
  <link href="css/products.css" rel="stylesheet" />
</head>

<body>
  <div id="header-placeholder"></div>
  <section class="container py-5" data-product-filter="sale">
    <h2 class="mb-2">Khuyến mãi</h2>
    <p class="text-muted mb-4">Ưu đãi có thời hạn - tiết kiệm đến 30% cho khăn và áo choàng tắm.</p>

    <div class="text-center mt-5 p-4 rounded" style="background-color: #F9F8BC;">
      <h3 class="mb-2" style="color: #4D561A;">Ưu đãi trong tuần</h3>
      <p class="mb-0 text-muted">Số lượng có hạn, đặt ngay để nhận giá ưu đãi.</p>
    </div>
  </section>
  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/search.js"></script>
  <script src="js/product-data.js"></script>
  <script src="js/product-renderer.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>


  <script>
    // Load header and footer components
    $(document).ready(function () {
      $('#header-placeholder').load('components/header.html', function () {
        if (typeof window.initializeHeaderComponents === 'function') {
          window.initializeHeaderComponents();
        }
        if (typeof setActiveNavItem === 'function') {
          setActiveNavItem();
        }
      });
      $('#footer-placeholder').load('components/footer.html');
    });
  </script>
</body>

</html>
