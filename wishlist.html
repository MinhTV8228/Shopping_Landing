<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh sách yêu thích - Khăn &amp; Áo choàng tắm Nõn Sợi</title>

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Custom CSS -->
  <link href="css/common.css" rel="stylesheet" />
  <link href="css/wishlist.css" rel="stylesheet" />
</head>

<body>
  <!-- Include Header Component -->
  <div id="header-placeholder"></div>

  <!-- Danh sách yêu thích Section -->
  <section class="wishlist-section py-5">
    <div class="container">
      <!-- Trang Header -->
      <div class="row mb-4">
        <div class="col-12">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
              <li class="breadcrumb-item active">Danh sách yêu thích</li>
            </ol>
          </nav>
          <h1 class="h2 mb-0">Danh sách yêu thích của bạn</h1>
        </div>
      </div>

      <!-- Danh sách yêu thích Content -->
      <div class="row">
        <!-- Danh sách yêu thích Items -->
        <div class="col-12">
          <div class="wishlist-items-container">
            <!-- Empty Danh sách yêu thích Tin nhắn -->
            <div id="empty-wishlist" class="empty-wishlist text-center py-5">
              <i class="bi bi-heart display-1 text-muted mb-3"></i>
              <h3 class="text-muted">Danh sách yêu thích đang trống</h3>
              <p class="text-muted mb-4">Hãy thêm sản phẩm vào danh sách yêu thích để lưu lại sau</p>
              <a href="index.html" class="btn btn-primary">
                <i class="bi bi-arrow-left me-2"></i>Continue Shopping
              </a>
            </div>

            <!-- Danh sách yêu thích Items Grid -->
            <div id="wishlist-items" class="row g-4" style="display: none;">
              <!-- Danh sách yêu thích items will be populated here by JavaScript -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Include Footer Component -->
  <div id="footer-placeholder"></div>

  <!-- Xóa Confirmation Modal -->
  <div class="modal fade" id="removeDanh sách yêu thíchModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Xóa from Danh sách yêu thích</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to remove this product from your wishlist?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-danger" id="confirmXóaDanh sách yêu thích">Xóa</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/product-data.js"></script>
  <script src="js/search.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/wishlist-page.js"></script>

  <script>
    // Load header and footer components
    $(document).ready(function () {
      $('#header-placeholder').load('components/header.html', function () {
        // After header is loaded, set active navigation
        if (typeof setActiveNavItem === 'function') {
          setActiveNavItem();
        }
      });
      $('#footer-placeholder').load('components/footer.html');
    });
  </script>
</body>

</html>
